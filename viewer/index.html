<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ifc2tiles viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Cesium.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #viewer { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    #panel {
      position: absolute; top: 8px; left: 8px; z-index: 1; max-width: 420px; max-height: 80vh; overflow: auto;
      background: rgba(20, 20, 20, 0.85); color: #eee; font: 12px/1.4 ui-monospace, monospace; padding: 8px; border-radius: 4px;
    }
    #panel table { border-collapse: collapse; }
    #panel td { padding: 1px 6px; vertical-align: top; border-bottom: 1px solid #444; }
  </style>
</head>
<body>
  <div id="viewer"></div>
  <div id="panel">tileset: <span id="src"></span><div id="info">部材をクリックすると属性を表示します</div></div>
  <script>
    // 使い方: /viewer/?tileset=/out/sample/tileset.json
    const params = new URLSearchParams(location.search);
    const tilesetUrl = params.get("tileset") ?? "/testdata/external/cesium-samples/FeatureIdAttributeAndPropertyTable/tileset.json";
    document.getElementById("src").textContent = tilesetUrl;

    const viewer = new Cesium.Viewer("viewer", {
      baseLayer: new Cesium.ImageryLayer(new Cesium.OpenStreetMapImageryProvider({ url: "https://tile.openstreetmap.org/" })),
      baseLayerPicker: false, geocoder: false, timeline: false, animation: false,
      terrainProvider: new Cesium.EllipsoidTerrainProvider(),
    });
    viewer.scene.globe.depthTestAgainstTerrain = true;
    window.viewer = viewer;

    (async () => {
      const tileset = await Cesium.Cesium3DTileset.fromUrl(tilesetUrl);
      viewer.scene.primitives.add(tileset);
      window.tileset = tileset;
      await viewer.zoomTo(tileset);
    })().catch((e) => { console.error(e); document.getElementById("info").textContent = String(e); });

    const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
    let selected;
    handler.setInputAction((ev) => {
      if (selected) { selected.color = Cesium.Color.WHITE; selected = undefined; }
      const picked = viewer.scene.pick(ev.position);
      const info = document.getElementById("info");
      if (!(picked instanceof Cesium.Cesium3DTileFeature)) { info.textContent = "（部材なし）"; return; }
      selected = picked;
      picked.color = Cesium.Color.YELLOW;
      const rows = picked.getPropertyIds().map((id) => `<tr><td>${id}</td><td>${String(picked.getProperty(id))}</td></tr>`);
      info.innerHTML = `<table>${rows.join("")}</table>`;
      window.lastPicked = Object.fromEntries(picked.getPropertyIds().map((id) => [id, picked.getProperty(id)]));
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
  </script>
</body>
</html>

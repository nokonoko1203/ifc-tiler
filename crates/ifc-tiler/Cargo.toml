[package]
name = "ifc-tiler"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "IFCを部材情報付きの3D Tiles 1.1へ変換するCLI"
publish = false

# 実行ファイル名は point-tiler（point_tiler）に合わせる
[[bin]]
name = "ifc_tiler"
path = "src/main.rs"

[dependencies]
# 版は公開から3日以上たったものを完全一致で固定する
ifc-lite-core = "=17.3.0"
ifc-lite-processing = "=17.3.0"
ifc-lite-export = "=17.3.0"
# 座標変換はpoint-tilerと同じくPROJ（9.6.2以上）を使う。見つからなければソースからビルドする
proj-sys = "=0.27.0"
geocentric = "=0.1.3"
meshopt = "=0.6.2"
clap = { version = "=4.6.7", features = ["derive"] }
serde_json = "=1.0.151"

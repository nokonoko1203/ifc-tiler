[package]
name = "ifc-tiler"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "A CLI that converts IFC into 3D Tiles 1.1 with element metadata"
publish = false

[[bin]]
name = "ifc_tiler"
path = "src/main.rs"

[dependencies]
ifc-lite-core = "=17.3.0"
ifc-lite-processing = "=17.3.0"
ifc-lite-export = "=17.3.0"
proj-sys = "=0.27.0"
geocentric = "=0.1.3"
meshopt = "=0.6.2"
clap = { version = "=4.6.7", features = ["derive"] }
serde_json = "=1.0.151"
libsqlite3-sys = { version = "=0.35.0", optional = true }

[features]
# Statically link PROJ and SQLite built from source, for release binaries. Grids cannot be used
bundled = ["proj-sys/bundled_proj", "dep:libsqlite3-sys", "libsqlite3-sys/bundled"]

[package.metadata.dist]
dist = true
